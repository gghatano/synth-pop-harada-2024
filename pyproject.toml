[project]
name = "synthpop-jp"
version = "0.0.0"
description = "Murata 2017 SA-based synthetic population generator with Harada 2024 evaluation."
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "synthpop-jp contributors" }]
keywords = [
    "synthetic-population",
    "simulated-annealing",
    "privacy",
    "utility",
    "japan",
    "census",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.urls]
Homepage = "https://github.com/hatanotakuma/synth-pop-harada-2024"
Repository = "https://github.com/hatanotakuma/synth-pop-harada-2024"
Issues = "https://github.com/hatanotakuma/synth-pop-harada-2024/issues"

[project.scripts]
synthpop-jp = "synthpop_jp.cli:main"

# External packages can register extensions via entry points.
# These groups are declared empty here; contributors plug in via
# their own distributions' `[project.entry-points]` sections.
[project.entry-points."synthpop_jp.evaluators"]

[project.entry-points."synthpop_jp.transitions"]

[project.entry-points."synthpop_jp.family_types"]

[dependency-groups]
dev = ["pre-commit>=3.7", "ruff>=0.5.6"]
test = [
    "pytest>=8",
    "pytest-xdist>=3.5",
    "pytest-cov>=5",
    "pytest-benchmark>=4",
    "hypothesis>=6.100",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
typing = ["pyright>=1.1.360"]

[tool.uv]
managed = true
default-groups = ["dev", "test", "typing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthpop_jp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/synthpop_jp",
    "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "NPY", # NumPy specific (includes NPY201 for 2.x)
    "PD",  # pandas-vet
    "PT",  # pytest-style
    "D",   # pydocstyle (numpydoc)
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    # 日本語コメント/文字列に含まれる全角括弧・記号の ambiguity 警告を抑制する。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PT011"]
"src/synthpop_jp/__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks benchmark tests (pytest-benchmark)",
]

[tool.coverage.run]
branch = true
source = ["synthpop_jp"]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
