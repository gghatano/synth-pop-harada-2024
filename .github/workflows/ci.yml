name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py3.12 / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies (frozen)
        run: uv sync --frozen --all-groups

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format --check
        run: uv run ruff format --check .

      - name: Pyright (strict)
        run: uv run pyright

      - name: Pytest (coverage)
        # Phase 0: coverage threshold held at 0%; Phase 2 以降で 80% に引き上げる。
        # pytest -n auto は Phase 2 以降でテスト数が増えたら再導入する。
        run: >-
          uv run pytest
          --cov=synthpop_jp
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=0

      - name: mkdocs build
        # Issue #102: ドキュメントサイトのビルドが壊れていないか確認。
        # MVP では --strict を使わない（既存 docs の repo-relative link を mkdocs
        # 形式に直す作業は別 Issue）。Phase 4 v0.2 残課題として progress-overview に記録。
        run: uv run mkdocs build

      - name: Smoke benchmark
        # 1000 世帯 × 1 万反復のエンドツーエンド軽量ベンチマークのみ（5 秒閾値）
        # μs スケールの per-call ベンチ（test_objective_delta / test_transition_propose）は
        # CI ランナーのノイズで閾値を割りやすいため、ローカル `make bench` 専用とする
        # （ローカル M1 で propose 7.5μs、CI Linux で 10.9μs と 1.45 倍ぶれる実測）。
        # 本格 20 万反復もローカル実行。
        # Issue #33: action-plan §5 リスク対応
        run: >-
          uv run pytest
          tests/benchmarks/test_sa_smoke.py
          -m benchmark
          --benchmark-only
          --benchmark-disable-gc
          --benchmark-warmup=off

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
