name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py3.12 / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies (frozen)
        run: uv sync --frozen --all-groups

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format --check
        run: uv run ruff format --check .

      - name: Pyright (strict)
        run: uv run pyright

      - name: Pytest (coverage)
        # Phase 0: coverage threshold held at 0%; Phase 2 以降で 80% に引き上げる。
        # pytest -n auto は Phase 2 以降でテスト数が増えたら再導入する。
        run: >-
          uv run pytest
          --cov=synthpop_jp
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=0

      - name: Smoke benchmark
        # 1000 世帯 × 1 万反復の軽量版ベンチマーク（フル 20 万反復はローカルで実行）
        # 閾値: 5 秒以内（CI 環境での性能ゲート）
        # Issue #33: action-plan §5 リスク対応
        run: >-
          uv run pytest
          tests/benchmarks/test_sa_smoke.py
          tests/benchmarks/test_objective_delta.py
          tests/benchmarks/test_transition_propose.py
          -m benchmark
          --benchmark-only
          --benchmark-disable-gc
          --benchmark-warmup=off

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
