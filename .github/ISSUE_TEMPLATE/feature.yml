name: 機能提案 / Feature request
description: 新機能の提案や改善アイデア
title: "[feature] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        機能提案をありがとうございます。「誰のどんな価値になるか」を中心に書いてください。

  - type: textarea
    id: motivation
    attributes:
      label: 動機 / 背景
      description: 誰がどんな状況で困っているか、どんな価値を提供したいか。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 実現したいこと。API や UI イメージがあれば添える。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した他の選択肢と、選ばなかった理由。
    validations:
      required: false

  - type: textarea
    id: success_criteria
    attributes:
      label: 成功条件（測定可能）
      description: 何が満たされれば完了と判断するか。
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 関連 Issue / ドキュメント
      description: 参照する spec 章、ADR、既存 Issue など
    validations:
      required: false
